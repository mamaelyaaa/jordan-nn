version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jordan-backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jordan-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/app:/app
      - /app/node_modules